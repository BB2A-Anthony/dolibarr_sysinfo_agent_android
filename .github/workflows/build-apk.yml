name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config zip unzip ccache git \
            libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          pip install buildozer cython 'virtualenv==20.25.1' 'pip==24.0'

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v3
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build debug APK
        run: |
          set -o pipefail
          rm -rf .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/venv
          buildozer android debug 2>&1 | tee build.log
      - name: Report failure cause on PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          SUMMARY=$(grep -iE 'error|exception|fail|traceback|not found|no such|refused|denied|invalid|unable|cannot' build.log | grep -viE 'Cwd|warnings?' | tail -n 20 | tr '\n' ' ' | cut -c1-3000)
          gh pr comment ${PR_NUMBER} --repo ${REPO} --body "Build failed. Cause: $SUMMARY" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolibarr-sysinfo-agent-apk
          path: bin/*.apk
          retention-days: 90
